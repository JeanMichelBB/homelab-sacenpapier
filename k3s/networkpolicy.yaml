# Default-deny ingress for the homelab-dashboard namespace (backend, frontend, redis).
# Egress is intentionally left open -- this backend reaches many external Tailscale IPs
# (Glances, TrueNAS, Prometheus, the k3s API, tspi for tracing), and restricting egress would
# mean allow-listing all of those individually. Same rationale as shared-mysql's policy for the
# default namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: homelab-dashboard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-homelab-frontend
  namespace: homelab-dashboard
spec:
  podSelector:
    matchLabels:
      app: homelab-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 80
---
# /metrics shares the API port (8000) with the main app, and Prometheus's NodePort scrape
# needs to reach it. Tried scoping ingress to Traefik + the node flannel-gateway IPs the SNAT'd
# scrape traffic appears to use (confirmed via this pod's own access log) -- that broke real
# Prometheus scraping in practice (verified live: the target went down within one scrape
# interval of the policy syncing), most likely because kube-router's NetworkPolicy enforcement
# evaluates the connection at a different point in the iptables chain than where the app sees
# the post-NAT source address, so the ipBlock never actually matched the real packet. Left this
# port unrestricted rather than ship a rule that looks tight but silently breaks monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-homelab-backend
  namespace: homelab-dashboard
spec:
  podSelector:
    matchLabels:
      app: homelab-backend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
# Only homelab-backend uses this Redis instance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
  namespace: homelab-dashboard
spec:
  podSelector:
    matchLabels:
      app: homelab-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: homelab-backend
      ports:
        - protocol: TCP
          port: 6379
