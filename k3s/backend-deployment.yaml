apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-backend
  namespace: homelab-dashboard
  annotations:
    secrets.doppler.com/reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-backend
  template:
    metadata:
      labels:
        app: homelab-backend
    spec:
      containers:
        - name: backend
          image: jeanmichelbb/homelab-be:latest
          ports:
            - containerPort: 8000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: homelab-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-backend
  namespace: homelab-dashboard
spec:
  selector:
    app: homelab-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-backend-metrics
  namespace: homelab-dashboard
spec:
  type: NodePort
  selector:
    app: homelab-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
