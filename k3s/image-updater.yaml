          optional: true
        name: ssh-known-hosts
      - configMap:
          name: argocd-image-updater-ssh-config
          optional: true
        name: ssh-config
      - name: ssh-signing-key
        secret:
          secretName: ssh-git-creds
          optional: true
      - name: argocd-image-updater-tls
        secret:
          secretName: argocd-image-updater-tls
          optional: true
          items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
      - emptyDir: {}
        name: tmp
