          - name: WEBHOOK_PORT
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: webhook.port
                optional: true
          - name: QUAY_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: webhook.quay-secret
                optional: true
          - name: DOCKER_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: webhook.docker-secret
                optional: true
          - name: GHCR_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: webhook.ghcr-secret
                optional: true
          - name: HARBOR_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: webhook.harbor-secret
                optional: true
          - name: ALIYUN_ACR_WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: argocd-image-updater-secret
                key: webhook.aliyun-acr-secret
                optional: true
          - name: WEBHOOK_RATELIMIT_ALLOWED
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: webhook.ratelimit-allowed
                optional: true
          - name: DISABLE_TLS
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: disable-tls
                optional: true
          - name: TLS_MIN_VERSION
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: tls.min-version
                optional: true
          - name: TLS_MAX_VERSION
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: tls.max-version
                optional: true
          - name: TLS_CIPHERS
            valueFrom:
              configMapKeyRef:
                name: argocd-image-updater-config
                key: tls.ciphers
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          image: "quay.io/argoprojlabs/argocd-image-updater:v1.3.0"
