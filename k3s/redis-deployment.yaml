apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-redis
  namespace: homelab-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-redis
  template:
    metadata:
      labels:
        app: homelab-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-redis
  namespace: homelab-dashboard
spec:
  selector:
    app: homelab-redis
  ports:
    - port: 6379
      targetPort: 6379
